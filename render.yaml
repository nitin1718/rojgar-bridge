services:
  # Next.js Frontend Service
  - type: web
    name: rojgar-bridge-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://rojgarbridge.onrender.com
